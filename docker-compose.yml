version: '3.8'

services:
  # API PRINCIPAL (Puerto 8080)
  flask-main:
    build: 
      context: .              # 🔹 Usa la carpeta raíz actual
      dockerfile: Dockerfile  # Usa el Dockerfile que está en la raíz
    container_name: flask_prod_container
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app                # Mapea la raíz para ver cambios en src
    restart: always

  # API SIMULACIÓN (Puerto 8082)
  flask-sim:
    build:
      context: ./api-simulacion   # 🔹 Entra a la carpeta api-simulacion
      dockerfile: Dockerfile.sim
    container_name: flask_sim_container
    ports:
      - "8082:8082"
    volumes:
      - ./api-simulacion:/app
    restart: always